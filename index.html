<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Control</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
      background: #f4f4f4;
      color: #222;
    }

    h1 { text-align: center; }

    .status {
      text-align: center;
      margin: 12px 0 20px;
      padding: 10px;
      border-radius: 8px;
      background: white;
    }

    .login, .control, .sensor {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      font-size: 18px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .loginBtn {
      background: #333;
      color: white;
    }

    .on {
      background: #2e9b50;
      color: white;
    }

    .off {
      background: #bbb;
      color: #111;
    }

    .logout {
      background: #ddd;
      color: #111;
      font-size: 14px;
    }

    .output {
      border-top: 1px solid #ddd;
      padding-top: 14px;
      margin-top: 14px;
    }

    .state {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      margin: 8px 0;
    }

    .sensorValue {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin: 12px 0;
    }

    .schedule {
      background: #eef7f1;
      padding: 16px;
      border-radius: 10px;
      margin-top: 16px;
    }

    .schedule label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    .schedule input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    #controls { display: none; }
  </style>
</head>

<body>

<h1>Farm Control</h1>

<div class="status" id="status">Not signed in</div>

<div class="login" id="loginBox">
  <h2>Firebase Login</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="loginBtn" id="loginBtn">Sign In</button>
</div>

<div class="control" id="controls">

  <h2>Farm Control</h2>

  <div class="sensor">
    <h3>Temperature</h3>
    <div class="sensorValue">
      <span id="temperature">--</span> °C
    </div>
  </div>

  <div class="sensor">
    <h3>Humidity</h3>
    <div class="sensorValue">
      <span id="humidity">--</span> %
    </div>
  </div>

  <div class="sensor">
    <h3>Inputs</h3>

    <div class="state">Input 1: <span id="input1">OFF</span></div>
    <div class="state">Input 2: <span id="input2">OFF</span></div>
    <div class="state">Input 3: <span id="input3">OFF</span></div>
    <div class="state">Input 4: <span id="input4">OFF</span></div>
  </div>

  <div class="output">
    <h3>Relay 1</h3>

    <div class="state" id="state1">OFF</div>

    <button class="on" onclick="setRelay(1, true)">ON</button>
    <button class="off" onclick="setRelay(1, false)">OFF</button>
  </div>

  <div class="schedule">
    <h3>Relay 1 Schedule</h3>

    <label>
      <input id="scheduleEnabled" type="checkbox">
      Enable automatic schedule
    </label>

    <label for="startTime">Start time</label>
    <input id="startTime" type="time" value="06:00">

    <label for="stopTime">Stop time</label>
    <input id="stopTime" type="time" value="06:30">

    <button class="on" id="saveScheduleBtn">
      Save Relay 1 Schedule
    </button>

    <div class="state" id="scheduleState">
      Schedule not loaded
    </div>
  </div>

  <div class="output">
    <h3>Relay 2</h3>

    <div class="state" id="state2">OFF</div>

    <button class="on" onclick="setRelay(2, true)">ON</button>
    <button class="off" onclick="setRelay(2, false)">OFF</button>
  </div>

  <div class="output">
    <h3>Relay 3</h3>

    <div class="state" id="state3">OFF</div>

    <button class="on" onclick="setRelay(3, true)">ON</button>
    <button class="off" onclick="setRelay(3, false)">OFF</button>
  </div>

  <div class="output">
    <h3>Relay 4</h3>

    <div class="state" id="state4">OFF</div>

    <button class="on" onclick="setRelay(4, true)">ON</button>
    <button class="off" onclick="setRelay(4, false)">OFF</button>
  </div>

  <button class="logout" id="logoutBtn">Sign Out</button>

</div>

<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    onValue
  } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDnOdpe6wlzxGyCIjqu7JvHXY3KQg5pabE",
    authDomain: "esp32-adda.firebaseapp.com",
    databaseURL: "https://esp32-adda-default-rtdb.firebaseio.com",
    projectId: "esp32-adda"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const status = document.getElementById("status");
  const loginBox = document.getElementById("loginBox");
  const controls = document.getElementById("controls");

  document.getElementById("loginBtn").onclick = async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      status.textContent = "Enter your email and password.";
      return;
    }

    try {
      status.textContent = "Signing in...";

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    } catch (error) {
      console.error(error);
      status.textContent = "Login failed: " + error.message;
    }
  };

  document.getElementById("logoutBtn").onclick =
    () => signOut(auth);

  onAuthStateChanged(auth, (user) => {

    if (user) {

      status.textContent = "Connected: " + user.email;
      loginBox.style.display = "none";
      controls.style.display = "block";

      for (let i = 1; i <= 4; i++) {

        const inputRef =
          ref(db, `Input/Input${i}`);

        onValue(inputRef, (snapshot) => {

          const value = snapshot.val();

          document.getElementById(
            "input" + i
          ).textContent =
            value === true ? "ON" : "OFF";
        });
      }

    } else {

      status.textContent = "Not signed in";
      loginBox.style.display = "block";
      controls.style.display = "none";
    }
  });

  for (let i = 1; i <= 4; i++) {

    const relayRef =
      ref(db, `relays/relay${i}`);

    onValue(relayRef, (snapshot) => {

      const value = snapshot.val();

      document.getElementById(
        "state" + i
      ).textContent =
        value === true ? "ON" : "OFF";
    });
  }

  const temperatureRef =
    ref(db, "test/temperature");

  onValue(temperatureRef, (snapshot) => {

    const value = snapshot.val();

    if (value !== null) {
      document.getElementById(
        "temperature"
      ).textContent =
        Number(value).toFixed(1);
    }
  });

  const humidityRef =
    ref(db, "test/humidity");

  onValue(humidityRef, (snapshot) => {

    const value = snapshot.val();

    if (value !== null) {
      document.getElementById(
        "humidity"
      ).textContent =
        Number(value).toFixed(1);
    }
  });

  const scheduleRef =
    ref(db, "schedule/relay1");

  onValue(scheduleRef, (snapshot) => {

    const schedule = snapshot.val();

    if (!schedule) {
      document.getElementById(
        "scheduleState"
      ).textContent = "No schedule saved";
      return;
    }

    document.getElementById(
      "scheduleEnabled"
    ).checked =
      schedule.enabled === true;

    document.getElementById(
      "startTime"
    ).value =
      String(schedule.startHour ?? 0).padStart(2, "0") +
      ":" +
      String(schedule.startMinute ?? 0).padStart(2, "0");

    document.getElementById(
      "stopTime"
    ).value =
      String(schedule.stopHour ?? 0).padStart(2, "0") +
      ":" +
      String(schedule.stopMinute ?? 0).padStart(2, "0");

    document.getElementById(
      "scheduleState"
    ).textContent =
      schedule.enabled
        ? "Schedule enabled"
        : "Schedule disabled";
  });

  document.getElementById(
    "saveScheduleBtn"
  ).onclick = async () => {

    if (!auth.currentUser) {
      status.textContent = "Please sign in first.";
      return;
    }

    const [startHour, startMinute] =
      document.getElementById(
        "startTime"
      ).value.split(":").map(Number);

    const [stopHour, stopMinute] =
      document.getElementById(
        "stopTime"
      ).value.split(":").map(Number);

    try {

      await set(scheduleRef, {
        enabled:
          document.getElementById(
            "scheduleEnabled"
          ).checked,
        startHour,
        startMinute,
        stopHour,
        stopMinute
      });

      status.textContent =
        "Relay 1 schedule saved.";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Schedule save failed: " +
        error.message;
    }
  };

  window.setRelay = async (relay, state) => {

    if (!auth.currentUser) {
      status.textContent = "Please sign in first.";
      return;
    }

    try {

      const relayRef =
        ref(db, `relays/relay${relay}`);

      await set(relayRef, state);

      status.textContent =
        `Relay ${relay} set to ${
          state ? "ON" : "OFF"
        }`;

    } catch (error) {

      console.error(error);

      status.textContent =
        "Write failed: " +
        error.message;
    }
  };

</script>

</body>
</html>
